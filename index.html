    <script>

        function girarCartao() {
            const card = document.getElementById('flipCard');
            card.classList.toggle('flipped');
        }

        // Copiar Pix
        async function copiarPix() {

            const chavePix = "46991044000121";

            try {

                await navigator.clipboard.writeText(chavePix);

                const toast = document.getElementById("toast");

                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2500);

            } catch (err) {

                console.error('Erro ao copiar:', err);

                alert('Não foi possível copiar automaticamente. Verifique as permissões do navegador.');

            }
        }

        // Converter links do Google Drive
        function converterUrlGoogleDrive(url) {

            if (!url) return '';

            url = url.trim();

            const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/;

            const match = url.match(driveRegex);

            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }

            return url;
        }

        // Carregar cardápio do KV
        async function carregarCardapio() {

            const container = document.getElementById('cardapioContainer');

            container.innerHTML = `
                <p style="text-align:center; color:var(--text-sub); margin-top:40px;">
                    Carregando cardápio...
                </p>
            `;

            try {

                const response = await fetch('/api/cardapio', {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();

                if (!data || !Array.isArray(data.categorias) || !Array.isArray(data.itens)) {
                    throw new Error('Estrutura do JSON inválida.');
                }

                if (data.categorias.length === 0) {

                    container.innerHTML = `
                        <p style="text-align:center; color:var(--text-sub); margin-top:40px;">
                            Nenhuma categoria cadastrada.
                        </p>
                    `;

                    return;
                }

                let html = '';

                const categorias = [...data.categorias].sort(
                    (a, b) => (Number(a.ordem) || 0) - (Number(b.ordem) || 0)
                );

                categorias.forEach(cat => {

                    const itensCat = data.itens
                        .filter(item =>
                            String(item.categoriaId) === String(cat.id) &&
                            item.disponivel !== false
                        )
                        .sort((a, b) =>
                            (Number(a.ordem) || 0) - (Number(b.ordem) || 0)
                        );

                    if (itensCat.length === 0) return;

                    html += `
                        <div class="categoria-titulo">
                            ${cat.nome}
                        </div>
                    `;

                    itensCat.forEach(item => {

                        const imgUrl = converterUrlGoogleDrive(item.imagem);

                        const imgTag = imgUrl
                            ? `<img src="${imgUrl}" class="item-img" alt="${item.nome}" onerror="this.style.display='none'">`
                            : '';

                        html += `
                            <div class="item-cardapio">

                                ${imgTag}

                                <div class="item-detalhes">

                                    <div class="item-topo">
                                        <span class="item-nome">${item.nome}</span>
                                        <span class="item-preco">R$ ${item.preco}</span>
                                    </div>

                                    ${item.descricao
                                        ? `<div class="item-descricao">${item.descricao}</div>`
                                        : ''
                                    }

                                </div>

                            </div>
                        `;

                    });

                });

                container.innerHTML = html || `
                    <p style="text-align:center; color:var(--text-sub); margin-top:40px;">
                        Nenhum item disponível no momento.
                    </p>
                `;

            } catch (err) {

                console.error('Erro ao carregar cardápio:', err);

                container.innerHTML = `
                    <p style="text-align:center; color:#ff4444; margin-top:40px;">
                        Erro ao carregar o cardápio.
                    </p>
                `;

            }

        }

        carregarCardapio();

    </script>

</body>
</html>
